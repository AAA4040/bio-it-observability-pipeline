version: '3.8'

services:
  # خدمة قاعدة البيانات - PostgreSQL
  db:
    image: postgres:alpine
    container_name: bio-it-database
    environment:
      - POSTGRES_USER=azhar_admin
      - POSTGRES_PASSWORD=secure_password123
      - POSTGRES_DB=bio_observability
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitor-network

  monitor-app:
    build: .
    container_name: my-monitor-app
    depends_on:
      - db
    environment:
      - MONITOR_LOG_PATH=/data/med_app.log
      - DB_HOST=db
      - DB_NAME=bio_observability
      - DB_USER=azhar_admin
      - DB_PASS=secure_password123
    volumes:
      - .:/data
    networks:
      - monitor-network

  # خدمة العرض (Nginx)
  web-server:
    image: nginx:alpine
    container_name: alerts-web-portal
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html:ro
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge

volumes:
  postgres_data:
