<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bio-IT Observability Portal</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #d32f2f;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        pre {
            background: #1e1e1e;
            padding: 15px;
            border-left: 5px solid #d32f2f;
            border-radius: 5px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            color: #ffcdd2;
        }

        .status-bar {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .refresh-note {
            color: #888;
            font-size: 0.8em;
            margin-top: 10px;
        }
    </style>
    <!-- Auto-refresh every 30 seconds to show new alerts -->
    <meta http-equiv="refresh" content="30">
</head>

<body>
    <div class="container">
        <h1>Critical Alerts Log</h1>
        <div class="status-bar">System Status: <span style="color: #4caf50;">Monitoring Active</span> | Source:
            /data/critical_alerts.log</div>
        <pre id="log-content">Loading alerts...</pre>
        <p class="refresh-note">Note: Page refreshes every 30 seconds. All timestamps are in UTC.</p>
    </div>

    <script>
        function loadLogs() {
            // إضافة Query String عشوائي لمنع المتصفح من التخزين المؤقت (Cache Busting)
            const timestamp = new Date().getTime();
            fetch('critical_alerts.log?v=' + timestamp)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('log-content').textContent = data || "No critical alerts detected yet.";
                })
                .catch(err => console.error('Error loading logs:', err));
        }

        // التحميل عند فتح الصفحة
        loadLogs();

        // التحديث التلقائي كل 10 ثوانٍ ليكون النظام أكثر استجابة
        setInterval(loadLogs, 10000);
    </script>
</body>

</html>
